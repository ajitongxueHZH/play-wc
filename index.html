  // 加载时把 MC 1.8.8 图铺成页面背景
  function setBg() {
    if (document.body) {
      document.body.style.background = "center/cover no-repeat url(" + SPLASH + ") #4a90c2";
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setBg);
  else setBg();
  // Hook createObjectURL：loader 生成启动图 blob 时换成 MC 1.8.8 图。
  // EPW 里的原始启动图字节不动，因此 CRC 校验仍然通过。
  var orig = URL.createObjectURL;
  var customUrl = null;
  URL.createObjectURL = function (obj) {
    try {
      if (obj instanceof Blob && obj.type && obj.type.indexOf("image/") === 0) {
        if (!customUrl) {
          var bin = atob(SPLASH.split(",")[1]);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          customUrl = orig.call(URL, new Blob([arr], { type: "image/png" }));
        }
        return customUrl;
      }
    } catch (e) { console.warn("[MCJS] splash hook failed:", e); }
    return orig.apply(URL, arguments);
  };
