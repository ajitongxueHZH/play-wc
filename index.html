								return new Promise(function (res, rej) {
									var req = indexedDB.open('mcjs-cache', 1);
									req.onupgradeneeded = function () { req.result.createObjectStore('assets'); };
									req.onsuccess = function () { res(req.result); };
									req.onerror = function () { rej(req.error); };
								});
							}
							async function readCache() {
								try {
									var db = await openDB();
									return await new Promise(function (res) {
										var r = db.transaction('assets', 'readonly').objectStore('assets').get(CACHE_KEY);
										r.onsuccess = function () { res(r.result || null); };
										r.onerror = function () { res(null); };
									});
								} catch (e) { return null; }
							}
							async function writeCache(blob) {
								try {
									var db = await openDB();
									await new Promise(function (res) {
										var tx = db.transaction('assets', 'readwrite');
										tx.objectStore('assets').put(blob, CACHE_KEY);
										tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
									});
								} catch (e) { console.warn('[MCJS] cache write skipped:', e); }
							}
							async function getPart(i, expected, forceRefresh) {
								var base = './parts/' + String(i).padStart(2, '0') + '.bin?v3';
								for (var attempt = 0; attempt < 12; attempt++) {
									try {
										// 只有明确要求刷新（启动图那一片）才加随机参数绕缓存；其余走 CDN 缓存
										var url = (forceRefresh || attempt > 0) ? base + '?r=' + Date.now() + '-' + Math.random().toString(36).slice(2) : base;
										var ctl = new AbortController();
										var timer = setTimeout(function () { ctl.abort(); }, 20000);
										var resp = await fetch(url, { cache: 'force-cache', signal: ctl.signal });
										clearTimeout(timer);
										if (!resp.ok) throw new Error('HTTP ' + resp.status);
										var buf = await resp.arrayBuffer();
										if (buf.byteLength !== expected) throw new Error('short ' + buf.byteLength + '/' + expected);
										return buf;
									} catch (e) {
										console.warn('[MCJS] part ' + i + ' attempt ' + (attempt + 1) + ':', e.message);
										if (attempt === 11) throw e;
										await sleep(300);
									}
								}
							}
							var blob = await readCache();
							if (blob && blob.size === total) {
								// 命中缓存直接使用，不做任何拼接（拼接会破坏 CRC 校验）
								status.textContent = '已命中本地缓存，正在启动游戏...';
								console.log('[MCJS] loaded assets from IndexedDB cache');
							} else {
								var parts = new Array(count), done = 0, cursor = 0;
								async function worker() {
									while (cursor < count) {
										var i = cursor++;
										parts[i] = await getPart(i, sizes[i], false);
										done++;
										status.textContent = '正在加载游戏资源 ' + Math.round(done / count * 100) + '%...';
									}
								}
								await Promise.all(Array.from({ length: 6 }, function () { return worker(); }));
								blob = new Blob(parts, { type: 'application/octet-stream' });
								if (blob.size !== total) throw new Error('assembled ' + blob.size + ' != ' + total);
								status.textContent = '资源就绪，正在缓存并启动游戏...';
								await writeCache(blob);
							}
							window.eaglercraftXOpts.assetsURI = URL.createObjectURL(blob);
							console.log('[MCJS] assets ready, starting game...');
							await main();
							status.remove();
						})().catch(function (e) {
							console.error('[MCJS] failed to load assets:', e);
							var box = document.createElement('div');
							box.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:16px;background:#ffe8e8;color:#b00000;font:14px sans-serif;z-index:99999';
							box.textContent = '资源加载失败，请刷新重试：' + e.message;
							document.body.appendChild(box);
						});
		});
	</script>
